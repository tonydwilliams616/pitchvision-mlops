# Video analysis + match summary, as a two-step pipeline:
#   1. analyse   - @champion detector on the clip (CPU), stats + annotated video to MLflow
#   2. summarise - Bedrock LLM turns those stats into a short match summary, logged to the same run
# Synced by argo-workflows-config; submit with scripts/video/submit-analysis.yaml
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: analyse-video
  namespace: workflows
spec:
  entrypoint: main
  serviceAccountName: argo-workflow # Pod Identity: read video-clips/, invoke the summary model

  arguments:
    parameters:
      # Inference image pinned by commit SHA (analyse_video.py + summarise_match.py)
      - name: image-tag
        value: "e4cb7bd8d932d43198248aec6ca201bb3afee6c1"
      - name: video-uri
        value: "s3://pitchvision-datasets-352438994554/video-clips/from-above-01.mp4"
      # Analyse every Nth frame: the CPU cost/coverage trade-off
      - name: every
        value: "5"
      - name: threshold
        value: "0.5"
      - name: alias
        value: champion
      # Must match the model the IAM policy allows (30-platform/workflows.tf)
      - name: bedrock-model-id
        value: "us.anthropic.claude-haiku-4-5-20251001-v1:0"

  # Finished workflows are cleaned up after a day
  ttlStrategy:
    secondsAfterCompletion: 86400

  templates:
    - name: main
      steps:
        - - name: analyse
            template: analyse
        - - name: summarise
            template: summarise
            arguments:
              parameters:
                # The MLflow run ID produced by the analyse step
                - name: run-id
                  value: "{{steps.analyse.outputs.parameters.run-id}}"

    - name: analyse
      # Guardrail: one attempt can't run for more than an hour
      activeDeadlineSeconds: 3600
      retryStrategy:
        limit: "1"
        retryPolicy: OnError
      nodeSelector:
        pitchvision.io/pool: general
      container:
        image: "352438994554.dkr.ecr.us-east-1.amazonaws.com/pitchvision/inference:{{workflow.parameters.image-tag}}"
        # Explicit command: Argo can't read the ENTRYPOINT of a private ECR image
        command: ["python", "/app/analyse_video.py"]
        args:
          - --video-uri={{workflow.parameters.video-uri}}
          - --every={{workflow.parameters.every}}
          - --threshold={{workflow.parameters.threshold}}
          - --alias={{workflow.parameters.alias}}
          - --run-name={{workflow.name}}
          - --run-id-file=/tmp/run-id
        env:
          - name: MLFLOW_TRACKING_URI
            value: "http://mlflow.mlflow.svc.cluster.local:80"
          - name: MODEL_NAME
            value: pitchvision-detector
          - name: AWS_DEFAULT_REGION
            value: us-east-1
        resources:
          # PyTorch uses all the cores it's given; fits a 4-vCPU spot node
          requests:
            cpu: "3"
            memory: 4Gi
          limits:
            memory: 6Gi
      outputs:
        parameters:
          - name: run-id
            valueFrom:
              path: /tmp/run-id

    - name: summarise
      inputs:
        parameters:
          - name: run-id
      activeDeadlineSeconds: 600
      # Retry transient failures (e.g. Bedrock throttling)
      retryStrategy:
        limit: "2"
        retryPolicy: OnError
      nodeSelector:
        pitchvision.io/pool: general
      container:
        image: "352438994554.dkr.ecr.us-east-1.amazonaws.com/pitchvision/inference:{{workflow.parameters.image-tag}}"
        command: ["python", "/app/summarise_match.py"]
        args:
          - --run-id={{inputs.parameters.run-id}}
          - --model-id={{workflow.parameters.bedrock-model-id}}
        env:
          - name: MLFLOW_TRACKING_URI
            value: "http://mlflow.mlflow.svc.cluster.local:80"
          - name: AWS_DEFAULT_REGION
            value: us-east-1
        resources:
          # Just an API call: small
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 1Gi
