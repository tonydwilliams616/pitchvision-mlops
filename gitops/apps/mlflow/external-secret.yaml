# Copies the RDS-managed master credentials into the mlflow-db Secret.
# The ARN identifies the secret; it is not itself sensitive.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-db
  namespace: mlflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: mlflow-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:352438994554:secret:rds!cluster-ab6d4230-69b1-4ef6-988c-ab2da43c84fd-eQrnte
        property: username
    - secretKey: password
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:352438994554:secret:rds!cluster-ab6d4230-69b1-4ef6-988c-ab2da43c84fd-eQrnte
        property: password
