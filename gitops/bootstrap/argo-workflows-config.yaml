# The workflows namespace now; WorkflowTemplates for the training pipeline later.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tonydwilliams616/pitchvision-mlops.git
    targetRevision: main
    path: gitops/platform/argo-workflows
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
