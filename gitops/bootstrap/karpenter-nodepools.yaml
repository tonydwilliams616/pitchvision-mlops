# Syncs Karpenter's EC2NodeClasses and NodePools. Recreated on every spin-up,
# and any manual change to them in the cluster is reverted (self-heal).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-nodepools
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tonydwilliams616/pitchvision-mlops.git
    targetRevision: main
    path: gitops/platform/karpenter
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
