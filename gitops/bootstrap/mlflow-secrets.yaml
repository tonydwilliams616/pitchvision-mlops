# The ExternalSecret that produces the mlflow-db Kubernetes Secret.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tonydwilliams616/pitchvision-mlops.git
    targetRevision: main
    path: gitops/apps/mlflow
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
