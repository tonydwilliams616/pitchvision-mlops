name: Terraform Deploy

on:
  pull_request:
    paths:
      - "terraform/stacks/**"
      - "terraform/modules/**"
      - ".github/workflows/terraform-deploy.yml"
  push:
    branches: [main]
    paths:
      - "terraform/stacks/**"
      - "terraform/modules/**"
      - ".github/workflows/terraform-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in line with terraform-ci.yml
  TF_VERSION: "latest"
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

jobs:
  discover:
    name: find stacks
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.find.outputs.stacks }}
    steps:
      - uses: actions/checkout@v5
      - id: find
        name: List stacks (sorted, so 00- runs before 10-)
        run: |
          stacks=$(find terraform/stacks -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u | jq -R . | jq -sc .)
          echo "Found: $stacks"
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # PLAN - on pull requests, read-only role, plan posted as a PR comment
  # ---------------------------------------------------------------------------
  plan:
    name: plan (${{ matrix.stack }})
    needs: discover
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      needs.discover.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # OIDC token for AWS
      pull-requests: write  # post the plan comment
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.discover.outputs.stacks) }}
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan > plan.txt 2>&1
          code=$?
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          STACK: ${{ matrix.stack }}
          PLAN_PATH: ${{ matrix.stack }}/plan.txt
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const stack = process.env.STACK;
            let plan = fs.readFileSync(process.env.PLAN_PATH, 'utf8');
            const max = 60000;
            if (plan.length > max) plan = '...(truncated)\n' + plan.slice(-max);

            const ok = process.env.EXIT_CODE === '0';
            const marker = `<!-- terraform-plan:${stack} -->`;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const body = [
              marker,
              `### ${ok ? '✅' : '❌'} Terraform plan: \`${stack}\``,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
              '',
              `_Commit ${sha}, run #${context.runNumber}_`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if plan failed
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1

  # ---------------------------------------------------------------------------
  # APPLY - on main only, gated by the "production" environment (manual approval)
  # ---------------------------------------------------------------------------
  apply:
    name: apply (${{ matrix.stack }})
    needs: discover
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.discover.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-apply-${{ matrix.stack }}
      cancel-in-progress: false
    strategy:
      fail-fast: true
      max-parallel: 1 # stacks apply one at a time, in order
      matrix:
        stack: ${{ fromJSON(needs.discover.outputs.stacks) }}
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: Apply
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan
