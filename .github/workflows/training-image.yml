name: Training Image

# Pull requests: build only (proves the Dockerfile works, no AWS access needed).
# main: build and push to ECR, tagged with the commit SHA.
on:
  pull_request:
    paths:
      - "ml/training/**"
      - ".github/workflows/training-image.yml"
  push:
    branches: [main]
    paths:
      - "ml/training/**"
      - ".github/workflows/training-image.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  REPOSITORY: pitchvision/training
  # Only pushes from main may publish images (matches the IAM trust policy)
  PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  build:
    name: build${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && ' and push' || '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (main only)
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          role-session-name: gha-ecr-push-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR (main only)
        id: ecr
        if: env.PUSH == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: ml/training
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.ecr.outputs.registry || 'local' }}/${{ env.REPOSITORY }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          # Reuse layers between runs via GitHub's cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Single plain image manifest (no attestation index) - simplest for ECR
          provenance: false

      - name: Summary
        if: env.PUSH == 'true'
        run: |
          echo "### Pushed training image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.ecr.outputs.registry }}/${REPOSITORY}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
