name: Terraform CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin this to match `terraform version` on your machine, e.g. "1.13.4"
  TF_VERSION: "latest"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive -diff terraform/

  discover:
    name: find Terraform roots
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        name: List directories containing .tf files
        run: |
          dirs=$(find terraform -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u | jq -R . | jq -sc .)
          echo "Found: $dirs"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

  validate:
    name: validate (${{ matrix.dir }})
    needs: discover
    if: needs.discover.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Init (no backend)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}
      - uses: terraform-linters/setup-tflint@v4
      - name: Init plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids GitHub API rate limits
      - name: Lint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  checkov:
    name: checkov security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checkov
        run: pip install checkov
      # soft-fail while the repo is young; we'll make this blocking in a later PR
      - name: Scan Terraform
        run: checkov -d terraform --framework terraform --compact --quiet --soft-fail

  # Single required check for branch protection - passes only if every job above did.
  ci-passed:
    name: ci-passed
    if: always()
    needs: [fmt, discover, validate, tflint, checkov]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo '${{ toJSON(needs) }}'
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more checks failed"
            exit 1
          fi
